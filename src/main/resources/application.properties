spring.application.name=cafe-popp-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/cafe_popp
spring.datasource.username=postgres
spring.datasource.password='add ur password here'

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.cache.type=caffeine
spring.cache.cache-names=menu-items
spring.cache.caffeine.spec=maximumSize=2,expireAfterWrite=60s

# Development-only repair for the seeded demo users. Disable in production.
app.security.seed-development-passwords=true

server.port=8080
